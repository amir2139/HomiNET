<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="HomiNET">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#111a3a"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <ellipse cx="640" cy="200" rx="520" ry="200" fill="url(#glow)"/>

  <!-- connection lattice -->
  <g stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M120 300 C 360 120, 520 120, 640 200 S 920 280, 1160 110"/>
    <path d="M120 110 C 380 260, 560 240, 700 180 S 980 120, 1160 300"/>
    <path d="M180 200 C 420 60, 700 340, 1100 200"/>
  </g>
  <g fill="#34d399">
    <circle cx="120" cy="300" r="5"/><circle cx="640" cy="200" r="6"/>
    <circle cx="1160" cy="110" r="5"/><circle cx="120" cy="110" r="4"/>
    <circle cx="1160" cy="300" r="4"/><circle cx="700" cy="180" r="4"/>
    <circle cx="180" cy="200" r="4"/><circle cx="1100" cy="200" r="5"/>
  </g>

  <!-- shield mark -->
  <g transform="translate(452,150)">
    <path d="M44 4 L82 18 V54 C82 84 64 104 44 114 C24 104 6 84 6 54 V18 Z"
          fill="none" stroke="url(#wm)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M26 58 l13 14 l24 -30" fill="none" stroke="url(#wm)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="560" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="1" fill="url(#wm)" filter="url(#soft)" opacity="0.55">HomiNET</text>
  <text x="560" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="1" fill="url(#wm)">HomiNET</text>

  <text x="562" y="262" font-family="'Segoe UI', Tahoma, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#c7d2fe" letter-spacing="4">FREE · SECURE · ALWAYS ON</text>

  <text x="640" y="330" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif"
        font-size="24" fill="#94a3b8" direction="rtl">اتصال آزاد، امن و پایدار — برای ویندوز و اندروید</text>
</svg>
